# End-to-end test environment for the GroupPermissions plugin.
# Usage: see tests/e2e/README.md (or simply run tests/e2e/bin/run.sh)
name: grouppermissions-e2e

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    tmpfs:
      - /var/lib/mysql

  mail:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  matomo:
    # no official image for Matomo 6 yet, see docker/Dockerfile
    build:
      context: ./docker
      args:
        MATOMO_VERSION: ${MATOMO_VERSION:-6.0.0-rc2}
    image: grouppermissions-e2e-matomo:${MATOMO_VERSION:-6.0.0-rc2}
    depends_on:
      db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
    ports:
      - "${MATOMO_PORT:-8089}:80"
    # The plugin is mounted read-only and copied into plugins/GroupPermissions by bin/setup.sh
    # (only runtime files are copied, the repo's vendor/ contains a full Matomo copy used by phpstan).
    volumes:
      - ../..:/plugin-src:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/matomo.php"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Integration tests with login plugins (bin/integration-test.sh): an LDAP server for LoginLdap
  # (with the memberOf overlay for groupOfUniqueNames) ...
  ldap:
    image: osixia/openldap:1.5.0
    profiles: ["integrations"]
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    tmpfs:
      - /var/lib/ldap
      - /etc/ldap/slapd.d

  # ... and an OpenID Connect provider for LoginOIDC / RebelOIDC: its login form lets the test choose the user
  # and the claims of the tokens (http://oidc:8080/default/...)
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    profiles: ["integrations"]
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'

  # ... and a SAML identity provider (SimpleSAMLphp) for LoginSaml, users in saml/authsources.php
  saml:
    image: kristophjunge/test-saml-idp:1.15
    profiles: ["integrations"]
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: matomo-e2e
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://matomo/index.php?module=LoginSaml&action=assertionConsumerService
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: http://matomo/index.php?module=LoginSaml&action=singleLogoutService
    volumes:
      - ./saml/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["test"]
    depends_on:
      matomo:
        condition: service_healthy
    working_dir: /e2e
    environment:
      MATOMO_URL: http://matomo
      MAILPIT_URL: http://mail:8025
      PLUGIN_DIR: /plugin
      CI: ${CI:-}
    volumes:
      - .:/e2e
      - e2e_node_modules:/e2e/node_modules
      # plugin sources, read by static checks (e.g. translations)
      - ../..:/plugin:ro
    ipc: host

volumes:
  e2e_node_modules:
